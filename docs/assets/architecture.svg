<svg viewBox="0 0 1020 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-full-title architecture-full-desc">
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-paper-2: #ececec;
      --color-ink: #2d3142; --color-muted: #4f5d75; --color-soft: #7a8399;
      --color-rule: rgba(45,49,66,0.12);
      --color-accent: #eb6c36; --color-accent-tint: rgba(235,108,54,0.08);
      --color-link: #2e5aa8;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); min-height: 100vh; padding: 3rem 2rem; color: var(--color-ink); }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { margin-bottom: 2.5rem; }
    .header-eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.75rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.75rem, 3vw + 1rem, 2.5rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 0.5rem; }
    .subtitle { font-size: 1rem; line-height: 1.55; color: var(--color-muted); max-width: 60ch; }
    .diagram-container { background: var(--color-paper-2); border-radius: 8px; border: 1px solid var(--color-rule); padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
    .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-top: 1.5rem; }
    @media (max-width: 820px) { .cards { grid-template-columns: 1fr; } }
    .card { background: #fff; border-radius: 6px; border: 1px solid var(--color-rule); padding: 1.25rem; }
    .card .eyebrow { font-family: var(--font-mono); font-size: 0.5rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    .card-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.875rem; padding-bottom: 0.875rem; border-bottom: 1px solid rgba(45,49,66,0.08); }
    .card-dot { width: 7px; height: 7px; border-radius: 50%; }
    .card-dot.ink { background: var(--color-ink); } .card-dot.muted { background: var(--color-muted); } .card-dot.coral { background: var(--color-accent); }
    .card h3 { font-size: 0.875rem; font-weight: 600; letter-spacing: -0.005em; }
    .card p, .card ul { color: var(--color-muted); font-size: 0.8125rem; line-height: 1.55; list-style: none; }
    .card li { margin-bottom: 0.3rem; padding-left: 0.875rem; position: relative; }
    .card li::before { content: '—'; position: absolute; left: 0; color: rgba(45,49,66,0.25); font-size: 0.75rem; }
    .footer { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(45,49,66,0.10); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; color: var(--color-soft); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
  </style></defs>

        <title id="architecture-full-title">Lakehouse & RAG Pipeline Architecture</title>
        <desc id="architecture-full-desc">Architecture diagram showing data ingested into DuckDB Bronze/Silver/Gold layers, synced to Qdrant, and queried by a Streamlit AI Coach using Hybrid Search and Reranker.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- ZONE: Lakehouse -->
        <rect x="220" y="80" width="580" height="116" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="470" y="84" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="510" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DUCKDB LAKEHOUSE</text>

        <!-- ZONE: Qdrant Sync -->
        <rect x="620" y="210" width="180" height="116" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="670" y="214" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="710" y="223" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VECTOR ENGINE</text>

        <!-- ZONE: RAG -->
        <rect x="220" y="340" width="580" height="116" rx="8" fill="rgba(235,108,54,0.02)" stroke="rgba(235,108,54,0.20)" stroke-width="0.8"/>
        <rect x="475" y="344" width="70" height="12" rx="2" fill="#f5f5f5"/>
        <text x="510" y="353" fill="rgba(235,108,54,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RAG PIPELINE</text>

        <!-- ARROWS -->
        <!-- R1: Crawlers -> Bronze -->
        <line x1="180" y1="140" x2="232" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- R1: Bronze -> Extractor -->
        <line x1="310" y1="172" x2="310" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- R1: Extractor -> Silver -->
        <path d="M 380,264 H 480 Q 488,264 488,256 V 180" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- R1: Bronze -> Silver (dbt bypass) -->
        <line x1="380" y1="140" x2="432" y2="140" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- R1: Silver -> Gold -->
        <line x1="580" y1="140" x2="632" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- R1: Gold -> Tab 1 -->
        <line x1="780" y1="140" x2="832" y2="140" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- R2: Silver -> sync_qdrant -->
        <line x1="510" y1="172" x2="510" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- R2: sync_qdrant -> Qdrant -->
        <line x1="580" y1="264" x2="632" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- R3: Coach App -> CV Parser (Upload) -->
        <path d="M 840,400 H 388" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- R3: CV Parser -> Hybrid Search -->
        <line x1="380" y1="400" x2="432" y2="400" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- R3: Hybrid Search -> Qdrant (Query) -->
        <path d="M 510,368 V 304" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- R3: Qdrant -> Hybrid Search (Results) -->
        <path d="M 640,264 H 600 Q 592,264 592,272 V 360 Q 592,368 584,368 H 570" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- R3: Hybrid Search -> GPT HR -->
        <line x1="580" y1="400" x2="632" y2="400" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- R3: GPT HR -> Coach App -->
        <line x1="780" y1="400" x2="832" y2="400" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>


        <!-- NODES -->

        <!-- N1: Crawlers -->
        <rect x="40" y="108" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="108" width="140" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="116" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="62" y="125" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
