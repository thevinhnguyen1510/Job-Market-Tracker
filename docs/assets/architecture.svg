        <text x="110" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Python Scripts</text>

        <!-- N2: Bronze -->
        <rect x="240" y="108" width="140" height="64" rx="6" fill="#f5f5f5"/>
